version: 2
updates:
  # Keep the pinned GitHub Actions SHAs current. Merging a PR here changes the
  # build environment, so require a green `verify` run before merging.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
